name: Xiaoxia quality and candidate delivery

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      full:
        description: Run all maintained contract groups for regression comparison
        type: boolean
        default: false
  schedule:
    - cron: '23 3 * * 0'

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: '1'
  PYTHONUTF8: '1'
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
  FULL_REGRESSION: ${{ github.event_name == 'schedule' || inputs.full == true }}

jobs:
  plan:
    name: File impact and execution plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      has_groups: ${{ steps.plan.outputs.has_groups }}
      base: ${{ steps.plan.outputs.base }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
      - run: npm ci --prefix quality --ignore-scripts --no-audit --no-fund
      - name: Derive consumers and risk from the exact source
        id: plan
        run: python -B -m tools.quality.ci plan --report out/plan.json
      - name: Preserve plan even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: impact-${{ env.HEAD_SHA }}
          path: out/
          if-no-files-found: error

  g1:
    name: G1 fast structural checks
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
          cache: npm
          cache-dependency-path: quality/package-lock.json
      - run: python -m pip install -r requirements/quality.txt
      - run: npm ci --prefix quality --ignore-scripts --no-audit --no-fund
      - name: Check affected source and gate counterexamples
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: python -B -m tools.quality.ci check --tier g1 --report out/g1.json
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g1-${{ env.HEAD_SHA }}
          path: out/
          if-no-files-found: error

  g2:
    name: G2 ${{ matrix.group }}
    needs: plan
    if: needs.plan.outputs.has_groups == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0d8abe699bfb85fec6de9f7adb5ae17292296ff
        with:
          version: '0.11.7'
          enable-cache: false
      - name: Create the pinned Windows consumer environment
        shell: pwsh
        run: |
          uv venv --no-project --managed-python --python '${{ matrix.python }}' --seed .venvs/ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          (Join-Path $env:GITHUB_WORKSPACE '.venvs/ci/Scripts') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "VIRTUAL_ENV=$(Join-Path $env:GITHUB_WORKSPACE '.venvs/ci')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
      - run: python -m pip install -r requirements/quality.txt
      - name: Install this consumer's isolated dependencies
        run: python -B -m tools.quality.ci install --group '${{ matrix.group }}'
      - run: npm ci --prefix quality --ignore-scripts --no-audit --no-fund
      - name: Exercise affected consumers
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: python -B -m tools.quality.ci check --tier g2 --group '${{ matrix.group }}' --report 'out/g2-${{ matrix.group }}.json'
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: g2-${{ matrix.group }}-${{ env.HEAD_SHA }}
          path: out/
          if-no-files-found: error

  metrics:
    name: Reproducible file map and code metrics
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
          cache: pip
          cache-dependency-path: requirements/quality.txt
      - run: python -m pip install -r requirements/quality.txt
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24.15.0'
      - run: npm ci --prefix quality --ignore-scripts --no-audit --no-fund
      - name: Measure both exact trees with the same rules
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: |
          python -B -m tools.quality.ci sources --cache out/upstreams --report out/sources.json
          python -B -m tools.quality.inventory --revision "$HEAD_SHA" --base "$BASE_SHA" --upstream-cache out/upstreams > out/metrics.json
          python -B -m tools.quality.report out/metrics.json > out/metrics.md
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: metrics-${{ env.HEAD_SHA }}
          path: |
            out/metrics.json
            out/metrics.md
            out/sources.json
          if-no-files-found: error

  candidate:
    name: Deliver exact candidate source and manifest
    needs: [plan, g1, g2, metrics]
    if: always() && needs.plan.result == 'success' && needs.g1.result == 'success' && needs.metrics.result == 'success' && (needs.g2.result == 'success' || needs.plan.outputs.has_groups == 'false')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - name: Package tracked source without local state or credentials
        env:
          BASE_SHA: ${{ needs.plan.outputs.base }}
        run: python -B -m tools.quality.ci package --report out/candidate.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: candidate-${{ env.HEAD_SHA }}
          path: out/
          if-no-files-found: error

  result:
    name: Required quality result
    needs: [plan, g1, g2, metrics, candidate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.13'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: g*-${{ env.HEAD_SHA }}
          path: out/checks
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: impact-${{ env.HEAD_SHA }}
          path: out/plan
      - name: Report actual job outcomes
        if: always()
        env:
          PLAN: ${{ needs.plan.result }}
          G1: ${{ needs.g1.result }}
          G2: ${{ needs.g2.result }}
          CANDIDATE: ${{ needs.candidate.result }}
          METRICS: ${{ needs.metrics.result }}
          HAS_GROUPS: ${{ needs.plan.outputs.has_groups }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          from tools.quality.ci_results import job_result, selection_audit
          outcomes = {k.lower(): os.environ[k] for k in ('PLAN','G1','G2','METRICS','CANDIDATE')}
          report = job_result(outcomes, os.environ['HAS_GROUPS'])
          plan_path = Path('out/plan/plan.json')
          plan = json.loads(plan_path.read_text(encoding='utf-8')) if plan_path.exists() else {}
          groups = {p.stem.removeprefix('g2-'): json.loads(p.read_text(encoding='utf-8')) for p in Path('out/checks').rglob('g2-*.json')}
          report['selection_audit'] = selection_audit(plan, groups)
          if report['selection_audit']['status'] != 'pass':
              report['status'] = 'fail'
          report['head'] = os.environ['HEAD_SHA']
          Path('out').mkdir(exist_ok=True)
          Path('out/result.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
          print(json.dumps(report))
          raise SystemExit(0 if report['status'] == 'pass' else 1)
          PY
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: result-${{ env.HEAD_SHA }}
          path: out/result.json
          if-no-files-found: error
